[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ai-scientist"
version = "0.1.0"
description = "Installable RAG + MCP skills framework with a reliability-loop workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Cursor AI Infrastructure contributors" }]
dependencies = [
  "mcp>=1.0.0",
  "PyYAML>=6.0",
  "numpy>=1.25",
  "scikit-learn>=1.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-chroma>=0.2",
  "langchain-huggingface>=0.1",
  "langchain-groq>=0.1",
  "langchain-openai>=0.1",
  "langchain-text-splitters>=0.3",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "pymupdf>=1.23",
  "pymupdf4llm>=0.0.5",
  "pdfplumber>=0.10",
  "pylatexenc>=2.10",
  "ftfy>=6.1",
  "regex>=2023.0.0",
  "tiktoken>=0.5",
  "unidecode>=1.3",
  "python-dotenv>=1.0",
  "pysqlite3-binary>=0.5",
  "umap-learn>=0.5",
  "matplotlib>=3.7",
]

[project.scripts]
rag-ai-scientist = "rag_ai_scientist.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_ai_scientist*", "rag*"]

[tool.setuptools.package-data]
"rag_ai_scientist" = ["skills/**/*.md"]

