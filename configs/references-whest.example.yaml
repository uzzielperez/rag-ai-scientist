# Example references config for the ARC WhiteBox Estimation Challenge.
# Copy to your whest-starterkit checkout:
#   cp configs/references-whest.example.yaml /path/to/whest-starterkit/configs/references.yaml
#
# Or generate interactively from whest-starterkit root:
#   rag-ai-scientist init-references --project-root . --references-dir ./references --force

indexing:
  collection_name: "whest-estimation"
  chunk_size: 1500
  chunk_overlap: 200
  scientific_chunk_size: 2000
  scientific_chunk_overlap: 300
  doc_type_rules:
    paper: ["papers", "publication"]
    analysis_note: ["analysis_notes", "notes"]
    documentation: ["docs", "readme", "manual", "examples"]

sources:
  - name: whest_concepts
    paths:
      - "../whest-starterkit/docs/concepts"
      - "../whest-starterkit/docs/how-to/algorithm-ideas.md"
      - "../whest-starterkit/docs/how-to/manage-flop-budget.md"
      - "../whest-starterkit/docs/reference/estimator-contract.md"
      - "../whest-starterkit/docs/reference/code-patterns.md"
    extensions: [".md"]

  - name: whest_examples
    paths:
      - "../whest-starterkit/examples"
    extensions: [".py"]

  - name: rag_ai_scientist_narrative
    paths:
      - "../rag-ai-scientist/docs/examples/whest_estimation_challenge_story.md"
    extensions: [".md"]

  # Optional: add papers you download to references/papers/
  - name: user_papers
    paths:
      - "./references/papers"
    extensions: [".pdf", ".md"]
