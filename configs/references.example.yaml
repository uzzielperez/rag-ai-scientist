indexing:
  collection_name: "rag-ai-scientist"
  chunk_size: 1500
  chunk_overlap: 200
  scientific_chunk_size: 2000
  scientific_chunk_overlap: 300
  doc_type_rules:
    paper: ["papers", "publication"]
    analysis_note: ["analysis_notes", "notes"]
    documentation: ["docs", "readme", "manual"]

sources:
  - name: "project_docs"
    paths:
      - "../README.md"
      - "../docs"
      - "../papers"
    extensions: [".md", ".txt", ".tex", ".pdf"]
  - name: "project_code"
    paths:
      - "../scripts"
      - "../rag"
    extensions: [".py", ".sh"]
  - name: "user_references"
    paths:
      - "~/public/my_references"
    extensions: [".pdf", ".md", ".txt", ".tex", ".py"]
